# JDK the Gradle daemon runs on, and with it javac: it must be at least the Java target of
# app/build.gradle.kts (JavaVersion.VERSION_25), or javac stops with "invalid source release".
# Android Studio's own JDK (jbr, 25) fits, so nothing is downloaded. The foojay download links
# that updateDaemonJvm writes were for JDK 21 and are left out on purpose.
toolchainVersion=25
