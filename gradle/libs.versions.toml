[versions]
appcompat = "1.8.0"
core = "1.19.1"
documentfile = "1.1.0"
gradle = "9.4.1"
junit = "4.13.2"
# AGP 9.4.1 asks for KGP 2.2.10; the serialization plugin declared at the root raises the
# whole build classpath to this version (check with `gradlew buildEnvironment`).
# KSP 2.3.x is versioned on its own, no longer "<kotlin>-<ksp>".
kotlin = "2.4.21"
ksp = "2.3.12"
lifecycle = "2.11.0"
constraintlayout = "2.2.2"
loggingInterceptor = "5.5.1"
material = "1.14.0"
navigation = "2.10.2"
# Watube fork github.com/Lycaon-Project/WatubeExtrato (branch watube-Extracto): LibreTube's SABR fork 3e863d7 + upstream fixes of 2026-10-05
# (65cabc2 caption track names, d050168 Gradle wrapper 9.8.0) + ab984a8 jsoup 1.23.2 (CVE-2026-75140)
# + 3313901 test User-Agent Firefox 153 ESR (tests only, the app sends its own User-Agent)
# + Watube hardening: no PoToken, SecureRandom nonces, sandboxed player JavaScript, dead code
# removed, comment author verified flag fixed, per-item regex caches.
# + 6d92d7d4 (2026-10-27): NewPipeExtractor dev merged (n-sig, clients, mocks, deps), tracking
# parameters stripped from links, googlevideo.com-only streaming URLs, checked DASH redirects,
# SABR URL crash fixed; 0c55ba6c: documentation.
# Full commit hash: JitPack keeps a "not found" answer per version string.
newpipeextractor = "0c55ba6c808970eb731f3e067047cdd20130de87"
# same JSON library as the extractor ships (its runtime dependency), for the player response
nanojson = "e9d656ddb49a412a5a0a5d5ef20ca7ef09549996"
preference = "1.2.1"
extJunit = "1.3.0"
espresso = "3.7.0"
workRuntime = "2.12.0"
retrofit = "3.0.0"
desugaring = "2.1.5"
coil = "3.6.3"
room = "2.8.5"
kotlinxSerialization = "1.12.0"
kotlinxDatetime = "0.8.0"
media = "1.8.0"
media3 = "1.11.1"
activity = "1.13.0"
biometric = "1.1.0"
# encrypted Room database (AES-256, HMAC-SHA512 per page); 4.20.0 was two weeks old too early
sqlcipher = "4.19.1"
# Argon2id for the encrypted backups (lightweight API only, no JCE provider registered)
bouncycastle = "1.86"
# downloads encrypted at rest (streaming AEAD); 1.24.0 was less than two weeks old
tink = "1.23.0"
fragment = "1.9.1"
uiautomator = "2.4.0"
benchmarkMacroJunit4 = "1.5.0"
baselineprofile = "1.5.0"
profileinstaller = "1.4.1"
paging = "3.5.3"
collection = "1.7.0"
swiperefreshlayout = "1.2.0"
splashscreen = "1.2.0"
protobuf = "4.36.2"
protobufPlugin = "0.10.0"
# not used directly: Media3 1.11.1 pulls Guava 33.3.1-android, affected by CVE-2026-102554
# (GHSA-xxph-c9ww-hj94, unbounded allocation on deserialization), fixed in 33.7.2
guava = "33.7.2-android"

[libraries]
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-fragment = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
junit = { module = "junit:junit", version.ref = "junit" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "loggingInterceptor" }
# encrypted DNS (util/PrivateDns.kt): OkHttp's own module, at the version of OkHttp itself
okhttp-dnsoverhttps = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps", version.ref = "loggingInterceptor" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
androidx-preference = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "extJunit" }
androidx-test-espressoCore = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-work-runtime = { group = "androidx.work", name="work-runtime-ktx", version.ref="workRuntime" }
androidx-media = { group = "androidx.media", name = "media", version.ref = "media" }
androidx-media3-exoplayer = { group = "androidx.media3", name="media3-exoplayer", version.ref="media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name="media3-exoplayer-hls", version.ref="media3" }
androidx-media3-exoplayer-dash = { group = "androidx.media3", name="media3-exoplayer-dash", version.ref="media3" }
androidx-media3-session = { group="androidx.media3", name="media3-session", version.ref="media3" }
androidx-media3-ui = { group="androidx.media3", name="media3-ui", version.ref="media3" }
# the player's requests through the app's OkHttp client (encrypted DNS, network policies)
androidx-media3-datasource-okhttp = { group="androidx.media3", name="media3-datasource-okhttp", version.ref="media3" }
newpipeextractor = { module = "com.github.Lycaon-Project:WatubeExtrato", version.ref = "newpipeextractor" }
nanojson = { module = "com.github.TeamNewPipe:nanojson", version.ref = "nanojson" }
square-retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
desugaring = { group = "com.android.tools", name = "desugar_jdk_libs_nio", version.ref = "desugaring" }
coil = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil"}
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
room = { group = "androidx.room", name="room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacroJunit4" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-paging = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "paging" }
androidx-collection = { group = "androidx.collection", name = "collection", version.ref = "collection" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
google-protobuf-javalite = { module = 'com.google.protobuf:protobuf-javalite', version.ref = 'protobuf' }
google-guava = { module = "com.google.guava:guava", version.ref = "guava" }
google-protobuf-kotlin-lite = { module = 'com.google.protobuf:protobuf-kotlin-lite', version.ref = 'protobuf' }

[plugins]
androidTest = { id = "com.android.test", version.ref = "gradle" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
androidApplication = { id = "com.android.application", version.ref = "gradle" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# WATUBE FIX: alias manquant -> cause des echecs de sync Android Studio
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
androidx-navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation"}
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-protobuf  = { id = "com.google.protobuf", version.ref = "protobufPlugin" }