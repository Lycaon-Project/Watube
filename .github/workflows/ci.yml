name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "README*.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"
  push:
    paths-ignore:
      - "README*.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"

# least privilege: jobs only read the repository unless they say otherwise
permissions:
  contents: read

jobs:
  debug-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x' # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Compile
        run: |
          ./gradlew assembleDebug

      # The debug build is debuggable and trusts user installed CAs: it keeps the debug key the
      # build gives it and is never signed with the release key (a public artifact signed by
      # that key would carry the release identity).
      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release-nightly:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      # WATUBE FIX (audit HIGH): nightlies used to publish the minify-disabled debug APK.
      # They are now built from the release variant (R8 + resource shrinking), so users of
      # the "nightly" tag install the same code quality as an official release.
      - name: Compile release
        run: ./gradlew assembleRelease

      - name: Sign Apk
        id: sign_apk
        uses: ilharp/sign-android-release@13dd52242698526f951aa8bb8696204f6fea702a # v2
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Verify signed release APK
        id: apk
        run: |
          signed=$(ls app/build/outputs/apk/release/*-signed.apk 2>/dev/null | head -n1)
          if [ -z "$signed" ]; then
            echo "::error::No signed release APK was produced"
            exit 1
          fi
          cp "$signed" app-release.apk
          echo "APK: $signed -> app-release.apk"

      - name: Get Date and Time
        run: |
          echo "TIME=$(date -u +'%T')" >> $GITHUB_ENV
          echo "DATE=$(date -u +'%d-%m-%Y')" >> $GITHUB_ENV

      - name: Create Nightly Tag
        run: git tag -f nightly && git push -f origin nightly

      - name: Create Nightly Release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          token: ${{ github.token }}
          tag:  nightly
          makeLatest: true
          prerelease: true
          allowUpdates: true
          updateOnlyUnreleased: true
          artifacts: app-release.apk
          name: Watube Nightly ${{ env.DATE }}
          body: |
            Watube Nightly build from ${{ env.DATE }} ${{ env.TIME }}

            > [!NOTE]
            > Nightly builds include features/fixes before the official release. Therefore, they are generally less stable than normal releases. Use nightly builds at your own risk.
